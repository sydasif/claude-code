# 2 spines, 4 leaves, EVPN/VXLAN bridging, two VLANs, four hosts
provider: clab
defaults.device: eos

plugin: [ fabric ]
fabric.spines: 2
fabric.leafs: 4

# EVPN route targets need a GLOBAL AS number: per-node or per-group bgp.as is not enough
bgp.as: 65000

groups:
  _auto_create: True
  leafs:
    module: [ ospf, bgp, vlan, vxlan, evpn ]
  spines:
    module: [ ospf, bgp, evpn ]
    bgp.rr: True
  hosts:
    members: [ H1, H2, H3, H4 ]
    device: linux

vlan.mode: bridge
vlans:
  orange:
    links: [ H1-L1, H2-L3 ]
  blue:
    links: [ H3-L2, H4-L4 ]

evpn.session: [ ibgp ]
evpn.vlans: [ orange, blue ]
